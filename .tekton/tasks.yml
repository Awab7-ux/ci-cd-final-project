apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        rm -rf ./* ./.[!.]* ./..?* 2>/dev/null || true
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: eslint
spec:
  workspaces:
    - name: source
  steps:
    - name: eslint
      image: node:18-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        npm install
        npm run lint
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jest-test
spec:
  workspaces:
    - name: source
  steps:
    - name: jest
      image: node:18-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        npm install
        npm test
